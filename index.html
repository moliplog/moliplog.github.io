<!-- 링크 미리보기(카카오톡·메일·문자): 앱을 새로 고칠 때 이 묶음은 그대로 두세요 -->

<meta name="theme-color" content="#0D1620" media="(prefers-color-scheme: dark)">

<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F6; --surface:#FFFFFF; --ink:#13233A; --ink-2:#55667C; --line:#D3DCE3;
  --water:#0C6E7D; --water-rgb:12,110,125; --on-water:#FFFFFF; --sun:#9A6510; --bad:#A93226; --bad-bg:#FBECEA;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  --display:"Gowun Batang","AppleMyungjo","Noto Serif KR","Noto Serif CJK KR","Batang",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1620; --surface:#142130; --ink:#E4ECF2; --ink-2:#93A5B6; --line:#27394B;
    --water:#57BFCB; --water-rgb:87,191,203; --on-water:#06222A; --sun:#E3B25A; --bad:#F2998E; --bad-bg:#3A1D1A;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1620; --surface:#142130; --ink:#E4ECF2; --ink-2:#93A5B6; --line:#27394B;
  --water:#57BFCB; --water-rgb:87,191,203; --on-water:#06222A; --sun:#E3B25A; --bad:#F2998E; --bad-bg:#3A1D1A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--ui);font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled,select:disabled,input:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 18px calc(56px + env(safe-area-inset-bottom))}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:24px}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:30px;gap:12px}
.status{margin:0;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--water);flex:none}
.status.bad{color:var(--bad)} .status.bad i{background:var(--bad)}
.link{border:0;background:none;padding:6px 0;font-size:14px;color:var(--water);text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--bad)}
.datenav{display:flex;align-items:center;gap:10px;margin-top:6px}
.when{flex:1;min-width:0;text-align:center}
.when h1{margin:0;font:700 25px/1.25 var(--display);letter-spacing:-.01em}
.when p{margin:2px 0 0;font-size:13px;color:var(--ink-2);min-height:24px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.when p .link{padding:0;font-size:13px}
.when p b{font-weight:600;color:var(--ink)}
.datepick{border:0;background:none;color:var(--water);font-size:13px;padding:0;min-height:24px;max-width:150px}
.icon-btn{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:22px;line-height:1}
.seg{display:flex;gap:0;margin:12px auto 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);max-width:240px}
.seg button{flex:1;height:40px;border:0;background:none;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}

.club{position:relative;margin:0 0 24px;padding-left:24px;font-size:15px;line-height:1.5;letter-spacing:-.01em;color:var(--ink-2);word-break:keep-all;overflow-wrap:anywhere}
.club b{font-weight:600;color:var(--ink)}
.club::before{content:"";position:absolute;left:6px;top:3px;bottom:3px;width:2px;border-radius:1px;background:var(--water)}
.club.empty::before{background:var(--line)}
.club.empty .link{padding:0;font-size:15px}
.club:has(+.pins){margin-bottom:0}
.club:has(+.pins)::before{bottom:0;border-radius:1px 1px 0 0}
/* the memo under the journal title: written once, there on every day's page until its × is pressed */
.pins{position:relative;margin:0 0 24px;padding:2px 0 0 24px}
.pins::before{content:"";position:absolute;left:6px;top:0;bottom:3px;width:2px;border-radius:0 0 1px 1px;background:var(--water)}
.pins.none::before{background:var(--line)}
.pin{position:relative;display:flex;align-items:flex-start;gap:6px;padding-left:13px}
.pin::before{content:"";position:absolute;left:1px;top:16px;width:4px;height:4px;border-radius:50%;background:var(--ink-2)}
.pin textarea{display:block;flex:1;min-width:0;border:0;background:none;resize:none;overflow:hidden;padding:7px 0 8px;font-size:16px;line-height:1.5;letter-spacing:-.01em;color:var(--ink-2);outline:none;border-bottom:1px solid transparent;border-radius:0}
.pin textarea:focus{color:var(--ink);border-bottom-color:var(--water)}
.pin textarea::placeholder{color:var(--ink-2);opacity:.45}
.pin textarea:focus::placeholder{color:transparent}
.pinx{flex:none;width:30px;height:38px;margin:0 -9px 0 -2px;padding:0;border:0;border-radius:6px;background:none;font-size:19px;line-height:1;color:var(--ink-2);opacity:.65}
.pinundo{margin:2px 0 6px;padding-left:13px;font-size:13px;color:var(--ink-2)}
.pinundo .link{padding:0 0 0 8px;font-size:13px}
#report{scroll-margin-top:140px}
.endbar{margin:8px 0 0 24px}
.endbar .solid{width:100%;height:48px}

/* notices */
.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:0 0 24px;font-size:14px;line-height:1.6}
.notice.bad{border-color:var(--bad);background:var(--bad-bg)}
.notice .actions{margin-top:6px;display:flex;gap:16px}

.install{border-color:var(--water)}
.install .ttl{display:block;font-weight:600;font-size:16px;margin-bottom:4px}
.pitch{display:block;margin-bottom:8px;font-weight:600}
.install .pitch{font-weight:400;color:var(--ink-2);margin-bottom:10px}
.install ol{margin:10px 0 0;padding-left:22px}
.install li{margin:5px 0}
.install .ico{display:inline-block;width:20px;height:20px;vertical-align:-5px;margin:0 3px;color:var(--water)}
.install .actions{margin-top:12px;gap:18px;align-items:center;flex-wrap:wrap}
a.solid{display:inline-flex;align-items:center;text-decoration:none}

/* outline: a bullet, then its children */
.node{position:relative;padding-left:24px;margin:0 0 28px}
.node>.dot{position:absolute;left:3px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.sec{display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:none;padding:3px 0;text-align:left;margin-bottom:4px}
.sec .t{font:600 17px/1.6 var(--ui)}
.sec .sum{flex:1;text-align:right;font-size:14px;color:var(--ink-2)}
.sec .go{flex:none;font-size:13px;color:var(--water);text-decoration:underline;text-underline-offset:3px}
.node.edit>.dot{top:17px}
.node>h2{margin:0 0 4px;font:600 17px/1.6 var(--ui);padding:3px 0}
.kids{margin-left:-17px;padding-left:22px;border-left:1px solid var(--line)}
.kid{position:relative;padding:7px 0}
.kids>.kids{margin-left:0;padding-left:0;border-left:0}
.kid::before{content:"";position:absolute;left:-13px;top:17px;width:5px;height:5px;border-radius:50%;background:var(--ink-2)}   /* the dot sits beside the FIRST line, however many lines follow */
.kid.text::before,.kid.todo::before{top:23px}
.kid.block::before{top:25px}
.kid:has(>.muted:first-child)::before{top:16px}                      /* small grey text */
.kid:has(>.chips)::before{top:24px}                                  /* a row of chips, even when it wraps */
.kid:has(>.rowf>.link)::before,.kid:has(>.link:first-child)::before{top:22px}
.kid.block:has(>.line:first-child)::before{top:17px}
.kid:not(.block):has(>.line)::before,.kid:has(>.habit)::before,.kid:has(>.rowf>.field)::before,.kid:has(>.mini)::before{top:50%;margin-top:-3px}   /* one row holding a control: centre on it */
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label{font-weight:500}
.label small{font-weight:400;font-size:13px;color:var(--ink-2);margin-left:6px}
.muted{color:var(--ink-2);font-size:14px}
.picks{display:flex;gap:6px;align-items:center}
select,.num{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none}
select.h{min-width:96px} select.p{min-width:70px}
.line{flex-wrap:nowrap}.line .label{min-width:0;white-space:nowrap}
/* the same narrow-screen rules, for when a larger text size leaves less than 360px of room (see applyTextSize) */
.narrow select.h{min-width:84px;padding:0 6px} .narrow select.p{min-width:62px;padding:0 6px} .narrow .label small{display:none}
@media (max-width:359px){select.h{min-width:84px;padding:0 6px} select.p{min-width:62px;padding:0 6px} .label small{display:none}}
.num{width:96px}
.unit{font-size:14px;color:var(--ink-2)}
.kid textarea{display:block;width:100%;border:0;background:none;resize:none;overflow:hidden;padding:6px 0;line-height:1.6;outline:none;border-bottom:1px solid transparent;border-radius:0}
.kid textarea:focus{border-bottom-color:var(--water)}
.kid textarea.box{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;overflow:auto;resize:vertical}
.kid textarea.box:focus{border-color:var(--water)}
.kid textarea::placeholder{color:var(--ink-2);opacity:.45}
/* larger text sizes: only the letters grow. The white space keeps the size it has at 'Small' (16px) (about 26px between two memos, 9.6px between lines, as seen on screen) */
.ts1 .kid.text{padding:6px 0} .ts1 .kid.text::before{top:22px} .ts1 .kid textarea{line-height:1.55}
.ts2 .kid.text{padding:5px 0} .ts2 .kid.text::before{top:20.5px} .ts2 .kid textarea{line-height:1.5}
.ts1 .tcheck,.ts2 .tcheck{margin-top:7px}
/* a to-do row and a habit row are the same kind of row (a box, then letters), so they are the same height at every text size:
   52px at 'Small' (16px); at the larger sizes the letters' 16px grow with the zoom and the 36px around them stay as they are on screen (row = 16px + 36px/zoom). */
.ts1 .kid.text.todo{padding:calc((16px + 36px/1.1 - 37px)/2) 0;--minh:37} .ts1 .kid.text.todo::before{top:calc((16px + 36px/1.1 - 37px)/2 + 16px)}
.ts2 .kid.text.todo{--minh:36}
/* on the day's page the to-do's box sits where the habit's box sits: centred on the (first) line of letters */
.kid.text.todo .tcheck{margin-top:7px} .ts1 .kid.text.todo .tcheck{margin-top:6.5px} .ts2 .kid.text.todo .tcheck{margin-top:6px}
/* rows that hold letters only (every list but the to-dos): 40px from one row to the next at 'Small' (16px), the same as the memo under the journal title.
   At the first 52px these rows looked empty beside rows that carry a box (to-dos, habits): thin letters weigh far less than a box, so the same blank reads wider.
   At the larger text sizes these rows are 'Small' (16px) magnified: 40px x zoom (44px, 48px on screen). Holding the blank at its 'Small' (16px) size on screen was tried
   and looked cramped: the eye reads the blank between two rows against the size of the letters, so it has to grow with them. */
.kid.text:not(.todo){padding:1px 0} .kid.text:not(.todo)::before{top:17px}
.ts1 .kid.text:not(.todo){padding:1px 0} .ts1 .kid.text:not(.todo)::before{top:17px}
.ts2 .kid.text:not(.todo){padding:1px 0} .ts2 .kid.text:not(.todo)::before{top:16.5px}
/* larger text sizes, the rest of the page: the same rule as the written bullets above. Only the letters' share grows; rows with buttons, section titles and the blanks between sections keep the size they have at 'Small' (16px) on screen (before this they all grew 1.1x / 1.2x with the zoom). 'Small' (16px) is not touched: every rule here needs .ts1 or .ts2 */
.ts1{--z:1.1} .ts2{--z:1.2}
:is(.ts1,.ts2) .node{margin-bottom:calc(28px/var(--z))}
:is(.ts1,.ts2) .sec,:is(.ts1,.ts2) .node>h2{padding:calc(3px/var(--z)) 0;margin-bottom:calc(4px/var(--z))}
:is(.ts1,.ts2) .sec .t,:is(.ts1,.ts2) .node>h2{line-height:calc(17px + 10.2px/var(--z))}
:is(.ts1,.ts2) .node:not(.edit)>.dot{top:calc(4.9px + 8.1px/var(--z))}
:is(.ts1,.ts2) .kid:not(.text){padding:calc(7px/var(--z)) 0}
:is(.ts1,.ts2) .kid:not(.text)::before{transform:translateY(calc(7px/var(--z) - 7px))}   /* dots placed by a fixed top follow the smaller padding */
:is(.ts1,.ts2) .kid:not(.block):has(>.line)::before,:is(.ts1,.ts2) .kid:has(>.habit)::before,:is(.ts1,.ts2) .kid:has(>.rowf>.field)::before,:is(.ts1,.ts2) .kid:has(>.mini)::before{transform:none}   /* dots centred on a control already follow it */
:is(.ts1,.ts2) select,:is(.ts1,.ts2) .num{height:calc(16px + 24px/var(--z))}
:is(.ts1,.ts2) .habit{min-height:calc(16px + 22px/var(--z))}
:is(.ts1,.ts2) .club,:is(.ts1,.ts2) .pins{margin-bottom:calc(24px/var(--z))}
:is(.ts1,.ts2) .club:has(+.pins){margin-bottom:0}
.kid textarea:focus::placeholder{color:transparent}
.habit{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:2px 0;border:0;background:none;text-align:left;font-weight:500}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ink-2);display:grid;place-items:center}
.check svg{width:14px;height:14px;opacity:0}
.habit[aria-pressed="true"] .check{background:var(--water);border-color:var(--water);color:var(--on-water)}
.habit[aria-pressed="true"] .check svg{opacity:1}

/* summaries */
.lead{margin:0 0 4px;font:700 22px/1.4 var(--display)}
.sub{margin:0 0 16px;font-size:14px;color:var(--ink-2)}
.depth{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:4px;margin:4px 0 10px}
.depth .axis{font-size:12px;color:var(--ink-2);display:flex;align-items:center}
.dayhead{border:0;background:none;padding:2px 0 4px;text-align:center;font-size:12px;color:var(--ink-2);line-height:1.3;border-radius:8px}
.dayhead b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.dayhead.today b{color:var(--water)} .dayhead.today{box-shadow:inset 0 -2px 0 var(--water)}
.cell{position:relative;height:58px;border-radius:7px;background:var(--surface);border:1px solid var(--line);overflow:hidden;padding:0;display:block;width:100%}
.cell .bar{position:absolute;left:0;right:0;top:20px;bottom:0}
.cell .bar i{position:absolute;left:0;right:0;bottom:0;display:block}
.cell .v{position:absolute;left:0;right:0;top:0;height:20px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.cell.cal .v{justify-content:space-between;padding:0 4px;font-size:11.5px;letter-spacing:-.02em}
.cell.cal .v em{font-style:normal;font-weight:400;color:var(--ink-2);font-size:10px}
.cell.none{border-style:dashed;background:none}
.cell.today{border-color:var(--water)}
.foot{text-align:center;font-size:12px;line-height:1.35;color:var(--ink-2);padding-top:2px}
.foot b{display:block;color:var(--ink);font-weight:600;font-size:13px}
@keyframes turnL{from{opacity:0;transform:translateX(45%)}to{opacity:1;transform:none}}
@keyframes turnR{from{opacity:0;transform:translateX(-45%)}to{opacity:1;transform:none}}
#root.turn-l{animation:turnL .28s cubic-bezier(.2,.7,.2,1)}
#root.turn-r{animation:turnR .28s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){#root.turn-l,#root.turn-r{animation:none}}
.legend{font-size:12.5px;color:var(--ink-2);margin:0}
.scale{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 20px;font-size:12px;color:var(--ink-2)}
.scale i{display:inline-block;width:20px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.cal7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:6px 0 4px}
.cal7 .wd{text-align:center;font-size:12px;color:var(--ink-2)}
.pipc{border:0;background:none;padding:2px 0;text-align:center;font-size:11px;color:var(--ink-2);line-height:1.2}
.pip{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);margin:0 auto 1px}
.pip.on{background:var(--water);border-color:var(--water)}
.pipc.today{color:var(--water);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:84px;margin:8px 0 2px}
.bars button{flex:1;min-width:0;height:100%;border:0;background:none;padding:0;display:flex;align-items:flex-end}
.bars i{display:block;width:100%;border-radius:4px 4px 1px 1px;background:var(--ink);opacity:.82;min-height:2px}
.bars i.none{background:var(--line);opacity:1;height:2px!important}
.barlabels{display:flex;gap:3px;font-size:11px;color:var(--ink-2)}
.barlabels span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:visible}
.barlabels b{display:block;color:var(--ink);font-weight:600;font-size:12px}
.rows .r{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.rows .r span:last-child{font-weight:600}
.entry{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;padding:0;text-align:left}
.entry .d{flex:none;width:76px;font-weight:600;font-size:14px;color:var(--sun)}
/* Summaries of written lines (events, notes, the notes unfolded under a chart) are pages for looking over many lines at once, while the day's page is for writing.
   So these rows are set closer than the day's page: smaller letters, less blank between rows, and a date column only as wide as the longest date in the list (the width is set on each row by dateW). */
.kids>.kid.sum{padding:4px 0}
.kids>.kid.sum::before{top:13px;transform:none}
.kids>.kid.sum .entry{font-size:15px;line-height:1.5;gap:8px}
.kids>.kid.sum .entry .d{font-size:12.5px}
.kids>.kid.sum.pick{padding:2px 0 6px}.kids>.kid.sum.pick::before{display:none}.kid.sum.pick .link{padding:4px 0;font-size:14px}

/* settings */
.field{display:block;width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field.sm{width:84px;flex:none;text-align:center;padding:0 6px}
.line.form .label{flex:none;width:88px}
.line.form .field{flex:1;min-width:0;width:auto}
input[type="date"].field{-webkit-appearance:none;appearance:none;text-align:left;line-height:40px;padding-top:0;padding-bottom:0}
input[type="date"].field::-webkit-date-and-time-value{text-align:left;margin:0;line-height:40px}
.field::placeholder{color:var(--ink-2);opacity:.45}
input[type="date"].field.blank{position:relative}
input[type="date"].field.blank::before{content:attr(data-eg);position:absolute;left:12px;top:0;line-height:40px;color:var(--ink-2);opacity:.45;pointer-events:none;white-space:nowrap}
input[type="date"].field.blank:not(:focus)::-webkit-datetime-edit{color:transparent}
input[type="date"].field.blank:not(:focus)::-webkit-date-and-time-value{color:transparent}
input[type="date"].field.blank:focus::before{content:none}
.tools{display:flex;gap:6px;flex:none}
.tools button,.mini{flex:none;white-space:nowrap;height:42px;min-width:42px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.rowf{display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:52px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:20px;background:var(--surface);font-weight:500}
.chips.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex-wrap:nowrap}
.chips.week button{min-width:0;padding:0;font-size:14px;border-radius:12px}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.solid{flex:none;white-space:nowrap;height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:600}
.box{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.5;resize:vertical}
.box.tall{min-height:420px;font:400 13px/1.6 var(--ui);white-space:pre-wrap}
.tag{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:8px;font-weight:400}
.kid.todo{display:flex;gap:10px;align-items:flex-start}
.kid.todo textarea{flex:1;min-width:0}
.tcheck{flex:none;width:24px;height:24px;margin-top:8px;border-radius:7px;border:1.5px solid var(--ink-2);background:none;padding:0;display:grid;place-items:center;color:var(--on-water)}
.tcheck svg{width:14px;height:14px;opacity:0}
.tcheck[aria-pressed="true"]{background:var(--water);border-color:var(--water)} .tcheck[aria-pressed="true"] svg{opacity:1}
.tcheck:disabled{opacity:.3}
.kid.todo.done textarea{color:var(--ink-2);text-decoration:line-through}
.entry .m{flex:none;width:18px;color:var(--water);font-weight:600}
</style>

/* ---------- pinned notes ----------
   The memo under the journal title: lines that stay on every day's page until their × is pressed. One record per line: {id,text,from,to}; `to` is FOREVER until then.
   A line is never copied into the days; a day's page simply shows every line of that section whose from..to holds that day,

  save(); }

      var btn=e.currentTarget; function ok(){btn.textContent=t('copied');} ta.focus(); ta.select();
      try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok,function(){ try{document.execCommand('copy');ok();}catch(_){} }); else { document.execCommand('copy'); ok(); } }catch(_){}
    }}),el('span',{class:'muted',text:t('copyHint')})))); }
  else bk.push(el('div',{class:'kid'},el('button',{class:'link',type:'button',text:t('makeBackup'),onclick:function(){saveNow();UI.backup=JSON.stringify(DB);render();}})));
  if(INSTALLABLE){
    var fin=el('input',{type:'file',accept:'.json,application/json,text/plain',style:'display:none'});
    fin.addEventListener('change',function(){ var f=fin.files&&fin.files[0]; if(!f) return; var rd=new FileReader();
      rd.onload=function(){ var txt=String(rd.result||''),o=null;
        try{ var i0=txt.indexOf('{'),i1=txt.lastIndexOf('}'); o=JSON.parse(i0>=0&&i1>i0?txt.slice(i0,i1+1):txt); }catch(e){ o=null; }
        if(o&&Array.isArray(o.template)&&o.days&&typeof o.days==='object'){ UI.importText=txt; UI.importErr=''; UI.mergeMsg=t('fileRead',{n:Object.keys(o.days).length}); }
        else { UI.importErr=t('fileBad'); UI.mergeMsg=null; }
        render(); };
      rd.onerror=function(){ UI.importErr=t('fileBad'); UI.mergeMsg=null; render(); };
      rd.readAsText(f); fin.value=''; });
    bk.push(el('div',{class:'kid'},el('div',{class:'rowf',style:'gap:18px;flex-wrap:wrap'},
      el('button',{class:'link',type:'button',text:t('saveFile'),onclick:saveBackupFile}),
      el('button',{class:'link',type:'button',text:t('pickFile'),onclick:function(){fin.click();}}),fin),
      IOS?el('p',{class:'muted',style:'margin:4px 0 0;font-size:13px',text:t('saveIOS')}):null));
  }
  function needsBackup(id,label,sure,fn){            /* acts only once there is something to read; with `sure` it asks once more first */
    if(sure&&UI.confirm===id) return twoStep(id,label,sure,fn,'link');
    return el('button',{class:'link',type:'button',text:label,onclick:function(){
      if(!String(UI.importText||'').trim()){ UI.mergeMsg=null; UI.importErr=t(INSTALLABLE?'importEmptyFile':'importEmpty'); render(); return; }
      UI.importErr=''; if(sure){ UI.mergeMsg=null; UI.confirm=id; render(); } else fn(); }});
  }
  /* Saving a file. An iPhone (above all the Home Screen app) ignores download links, so there the file goes through the share sheet: 'Save to Files', mail, AirDrop. */
  function saveBackupFile(){ saveNow();
    var json=JSON.stringify(DB);
    saveFileSmart('journal-backup-json-'+keyOf(today()),json,[['json','application/json'],['txt','text/plain']],function(){ UI.backup=json; UI.importErr=''; UI.mergeMsg=t('saveAsText'); render(); });
  }
  function readImport(){ var raw=UI.importText,i0=raw.indexOf('{'),i1=raw.lastIndexOf('}'); return JSON.parse(i0>=0&&i1>i0?raw.slice(i0,i1+1):raw); }
  var imp=el('textarea',{class:'box','aria-label':t('importAria'),placeholder:t('pasteHere')}); imp.value=UI.importText; imp.addEventListener('input',function(){UI.importText=imp.value;});
  bk.push(el('div',{class:'kid block'},imp,UI.importErr?el('p',{class:'muted',style:'color:var(--bad);margin:6px 0 0',text:UI.importErr}):null,
    UI.mergeMsg?el('p',{class:'muted',style:'margin:6px 0 0;color:var(--water)',role:'status',text:UI.mergeMsg}):null,
    UI.confirm==='import'?el('p',{class:'muted',style:'color:var(--bad);margin:6px 0 0',role:'alert',text:t('restoreWarn')}):null,
    el('div',{class:'rowf',style:'margin-top:8px;gap:18px;flex-wrap:wrap'},
      needsBackup('merge',t('merge'),null,function(){
        try{ var r=mergeBackup(readImport()); UI.importText=''; UI.importErr=''; UI.backup=null;
          UI.mergeMsg=((r.added||r.grew)?t('merged',{a:r.added,b:r.grew}):r.pins?t('mergedJust'):t('mergedNone'))+(r.pins?' '+t('mergedPins',{n:r.pins}):''); saveNow(); render(); }
        catch(e){ UI.mergeMsg=null; UI.importErr=t('importErr'); render(); } }),
      needsBackup('import',t('restore'),t('restoreSure'),function(){
        try{ adopt(readImport()); UI.importText=''; UI.importErr=''; UI.backup=null; saveNow(); go('day'); }
        catch(e){ UI.mergeMsg=null; UI.importErr=t('importErr'); render(); } })),
    el('p',{class:'muted',style:'margin:8px 0 0;font-size:13px',text:t('mergeNote')})));
  bk.push(el('div',{class:'kid'},el('button',{class:'link',type:'button',text:t('allTextOpen'),onclick:function(){go('alltext');}}),
    el('p',{class:'muted',style:'margin:4px 0 0;font-size:13px',text:t('allTextHint',{btn:t(INSTALLABLE?'saveFile':'makeBackup')})})));
  bk.push(el('div',{class:'kid'},twoStep('wipe',t('wipe'),t('wipeSure'),function(){ DB.days={}; DB.pins=[]; DB.trash=[]; DB.template=defaultTemplate(lang()); saveNow(); go('day'); },'link danger')));
  var end=el('div',{class:'endbar'},el('button',{class:'solid',type:'button',text:t('back'),onclick:function(){go('day');}}),
    el('p',{class:'muted',style:'margin:14px 0 0;text-align:center;font-size:12px',text:t('version')+' '+BUILD}));
  return [head,report,delNote].concat(secs,[adders,restore,week,langs,sizes,node(el('h2',{text:t('backup')}),bk),end]);
}

/* ---------- boot ---------- */
function applyLang(){ document.documentElement.lang=lang(); document.title=t('appName'); }
var TEXT_ZOOM=[1,1.1,1.2];   /* Small 16px, Normal 17.6px (the default), Large 19.2px. Text size: the whole page grows by the same ratio, so nothing on the day page has to change */
function applyTextSize(){ var i=DB.settings.textSize|0,z=TEXT_ZOOM[i]||1,r=$('#root'); r.style.zoom=z===1?'':String(z); r.classList.toggle('narrow',window.innerWidth/z<360); r.classList.toggle('ts1',i===1); r.classList.toggle('ts2',i===2); }
window.addEventListener('resize',applyTextSize);
function render(){ var root=$('#root'); root.replaceChildren.apply(root,(UI.screen==='summary'?screenSummary():UI.screen==='settings'?screenSettings():UI.screen==='export'?screenExport():UI.screen==='alltext'?screenAllText():screenDay()).filter(Boolean)); renderStatus(); }
function rollover(){ var k=keyOf(today()); if(k===todayKeySeen) return; var was=todayKeySeen; todayKeySeen=k;
  if(UI.screen==='day'&&keyOf(UI.date)===was&&!(document.activeElement&&document.activeElement.tagName==='TEXTAREA')){ UI.date=today(); render(); } }
/* The same app may be open in another window (a browser tab and the installed app share one store). Each window saves its whole copy,
   so before anything is written from here we read in what the other window saved. Skipped while this window still has something unsaved. */
function resync(){
  if(saveTimer||!storageOk) return;
  var raw; try{ raw=localStorage.getItem(KEY); }catch(e){ return; }
  if(!raw||raw===lastRaw) return;
  try{ adopt(JSON.parse(raw)); }catch(e){ return; }
  lastRaw=raw; UI.confirm=null; UI.pinUndo=null; UI.backup=null; applyLang(); applyTextSize();
  if(UI.screen!=='export'&&UI.screen!=='alltext') render();
}
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'){ if(saveTimer) saveNow(); } else { resync(); rollover(); checkUpdate(); } });
window.addEventListener('focus',resync);
window.addEventListener('pageshow',function(e){ if(e.persisted) resync(); });
window.addEventListener('pagehide',function(){ if(saveTimer) saveNow(); });
setInterval(function(){ rollover(); if(Date.now()-lastCheck>3600000) checkUpdate(); },60000);
function softRender(){ var a=document.activeElement; if(UI.screen==='day'&&!(a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))) render(); }
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; softRender(); });
window.addEventListener('appinstalled',function(){ installed=true; installEvt=null; softRender(); });
/* ---------- picking up a new version ----------
   Coming back to the app (and a moment after opening it) we read the BUILD of the index.html that is on the site.
   If it differs from ours, the page reloads itself. While someone is writing, or is away from today's page,
   the reload waits and happens the instant they next come back to the app. */
var lastAct=0,lastCheck=0,updPending='',UPD_KEY='molip-update-tried';
['input','pointerdown','keydown'].forEach(function(n){ document.addEventListener(n,function(){ lastAct=Date.now(); },true); });
function quietNow(){ return UI.screen==='day'&&keyOf(UI.date)===keyOf(today())&&Date.now()-lastAct>8000; }
function applyUpdate(nb){ if(!quietNow()){ updPending=nb; return; }
  try{ sessionStorage.setItem(UPD_KEY,nb+'|'+Date.now()); }catch(e){}   /* per window: one window updating must not hold the others back */
  if(saveTimer) saveNow();   /* write only what is still unsaved here: another open window may hold newer records */
  location.reload(); }
function checkUpdate(){
  if(updPending){ applyUpdate(updPending); return; }
  if(!HOSTED||!('serviceWorker' in navigator)||!navigator.serviceWorker.controller) return;
  var now=Date.now(); if(now-lastCheck<60000) return; lastCheck=now;
  fetch(location.pathname+'?fresh=1',{cache:'no-cache'}).then(function(r){ return r.ok?r.text():''; }).then(function(txt){
    var m=/var BUILD='([^']*)'/.exec(txt); if(!m||m[1]===BUILD) return;
    var p=''; try{ p=sessionStorage.getItem(UPD_KEY)||''; }catch(e){} p=p.split('|');
    if(p[0]===m[1]&&now-Number(p[1])<1800000) return;   /* already reloaded for this version a moment ago: never loop */
    applyUpdate(m[1]);
  }).catch(function(){});
}
setTimeout(checkUpdate,3000);
load(); applyLang(); applyTextSize(); dayRec(keyOf(today()),true); render(); save();
if(HOSTED&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){ try{navigator.serviceWorker.register('sw.js');}catch(e){} }
try{ if(HOSTED&&navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
